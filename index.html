<script>
(function () {
  var D = window.D, Q = D.q, CHAVE = 'quintas-respostas-' + D.nivel;
  var dec = {}; try { dec = JSON.parse(localStorage.getItem(CHAVE)) || {}; } catch (e) {}
  var guarda = function () { try { localStorage.setItem(CHAVE, JSON.stringify(dec)); } catch (e) {} };
  var NOME = { s: 'Sim', t: 'Talvez', n: 'Não' };
  var vista = 'triagem', atual = null, foto = 0, anterior = [];
  var app = document.getElementById('app');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var feitas = function () { return Q.filter(function (q) { return dec[q.i]; }).length; };
  var proxima = function () { for (var k = 0; k < Q.length; k++) if (!dec[Q[k].i]) return Q[k]; return null; };
  var url = function (q, n) { return q.p + '640/' + q.u[n]; };

  function topo() {
    var f = feitas();
    return '<div class="topo"><span>' + esc(D.nome) + ' · ' + f + ' de ' + Q.length + '</span><button id="muda">' + (vista === 'triagem' ? 'Ver resultados' : 'Voltar à triagem') + '</button></div>' +
      '<div class="barra"><i style="width:' + (Q.length ? Math.round(f / Q.length * 100) : 0) + '%"></i></div>';
  }
  function ligaTopo() { document.getElementById('muda').onclick = function () { vista = vista === 'triagem' ? 'resultados' : 'triagem'; if (vista === 'triagem') atual = null; desenha(); }; }

  function triagem() {
    var q = atual || proxima();
    if (!q) {
      app.innerHTML = topo() + '<div class="cartao"><div class="fim"><h1>✓ Triagem concluída</h1><p>Já decidiste todas as ' + Q.length + ' quintas.</p><button class="grande" id="ir">Ver e enviar resultados</button></div></div>';
      ligaTopo(); document.getElementById('ir').onclick = function () { vista = 'resultados'; desenha(); }; return;
    }
    atual = q; if (foto >= q.u.length) foto = 0;
    app.innerHTML = topo() + '<div class="cartao"><div class="foto"><img alt="" src="' + esc(url(q, foto)) + '"><span class="pilula" id="cont">' + (foto + 1) + ' / ' + q.u.length + '</span>' +
      '<div class="legenda"><h1>' + esc(q.n) + '</h1><div>' + esc(q.l) + '</div></div><div class="zona esq"></div><div class="zona dir"></div></div>' +
      '<div class="corpo"><div class="factos">' + esc(q.f) + '</div><div class="etiquetas">' + q.c.map(function (c) { return '<span class="et ' + c[1] + '">' + esc(c[0]) + '</span>'; }).join('') + '</div>' +
      '<a class="liga" href="' + esc(q.k) + '" target="_blank" rel="noopener">Ver no casamentos.pt ↗</a>' +
      '<div class="botoes">' + ['s', 't', 'n'].map(function (d) { return '<button class="b-' + { s: 'sim', t: 'talvez', n: 'nao' }[d] + (dec[q.i] === d ? ' atual' : '') + '" data-d="' + d + '">' + NOME[d] + '</button>'; }).join('') + '</div>' +
      (anterior.length ? '<p class="nota" style="text-align:center"><button id="desfaz" style="background:none;border:0;font:inherit;color:inherit;text-decoration:underline">Voltar à quinta anterior</button></p>' : '') + '</div></div>';
    ligaTopo();
    var img = app.querySelector('.foto img'), cont = document.getElementById('cont');
    var anda = function (p) { foto = (foto + p + q.u.length) % q.u.length; img.src = url(q, foto); cont.textContent = (foto + 1) + ' / ' + q.u.length; var seg = new Image(); seg.src = url(q, (foto + 1) % q.u.length); };
    app.querySelector('.esq').onclick = function () { anda(-1); };
    app.querySelector('.dir').onclick = function () { anda(1); };
    var pre = new Image(); pre.src = url(q, 1 % q.u.length);
    Array.prototype.forEach.call(app.querySelectorAll('.botoes button'), function (b) {
      b.onclick = function () { dec[q.i] = b.getAttribute('data-d'); guarda(); anterior.push(q.i); atual = null; foto = 0; desenha(); window.scrollTo(0, 0); };
    });
    var df = document.getElementById('desfaz');
    if (df) df.onclick = function () { var id = anterior.pop(); atual = Q.filter(function (x) { return x.i === id; })[0] || null; foto = 0; desenha(); };
  }

  function codigo() {
    var ord = Q.slice().sort(function (a, b) { return (+a.i.slice(1)) - (+b.i.slice(1)); });
    return 'QUINTAS-RESPOSTAS:N' + D.nivel + ':' + D.quem + ':' + ord.map(function (q) { return dec[q.i] || '-'; }).join('');
  }
  function resultados() {
    var grupo = function (d) {
      var l = Q.filter(function (q) { return dec[q.i] === d; });
      return '<div class="sec"><h2>' + NOME[d] + ' (' + l.length + ')</h2>' + (l.length ? l.map(function (q) { return '<button class="item" data-id="' + esc(q.i) + '"><span>' + esc(q.n) + '</span><small>' + esc(q.l.split(' · ')[0]) + '</small></button>'; }).join('') : '<p class="nota">Nenhuma.</p>') + '</div>';
    };
    var faltam = Q.length - feitas();
    app.innerHTML = topo() + '<button class="grande" id="enviar">Enviar resultados ao Tiago</button>' +
      '<p class="nota" id="aviso">' + (faltam ? 'Ainda faltam ' + faltam + ' quintas. Podes enviar agora e voltar a enviar no fim.' : 'Triagem completa.') + ' Toca numa quinta para mudar a resposta.</p><div id="manual"></div>' +
      grupo('s') + grupo('t') + grupo('n');
    ligaTopo();
    Array.prototype.forEach.call(app.querySelectorAll('.item'), function (b) {
      b.onclick = function () { var id = b.getAttribute('data-id'); atual = Q.filter(function (x) { return x.i === id; })[0]; foto = 0; vista = 'triagem'; desenha(); window.scrollTo(0, 0); };
    });
    document.getElementById('enviar').onclick = function () {
      var t = codigo(), aviso = document.getElementById('aviso');
      var manual = function () { document.getElementById('manual').innerHTML = '<textarea rows="5" readonly>' + esc(t) + '</textarea>'; aviso.textContent = 'Copia o texto abaixo e envia-o ao Tiago por mensagem.'; };
      if (navigator.share) navigator.share({ text: t }).then(function () { aviso.textContent = 'Enviado. Podes voltar a enviar quando mudares alguma resposta.'; }, function (e) { if (!e || e.name !== 'AbortError') manual(); });
      else if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { aviso.textContent = 'Texto copiado. Cola-o numa mensagem para o Tiago.'; }, manual);
      else manual();
    };
  }
  function desenha() { if (vista === 'triagem') triagem(); else resultados(); }
  desenha();
})();
</script>
